<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f2a47">
<title>Lcy Daniel – Gestion Garage</title>
<style>
:root{--navy:#0f2a47;--navy2:#17406b;--accent:#f59e0b;--bg:#eef2f6;--card:#fff;--txt:#1b2733;--mut:#6b7a89;--ok:#16a34a;--bad:#dc2626;--line:#dfe6ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto;background:var(--bg);position:relative}
header.top{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 12px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--accent)}
.logo{width:62px;height:44px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;padding:3px}
.logo img{max-width:100%;max-height:100%;display:block}
.hname{flex:1;min-width:0}
.hname b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hname small{color:#b9c9da;font-size:13px}
.back{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:15px}
main{flex:1;overflow-y:auto;padding:14px 14px 20px;-webkit-overflow-scrolling:touch}
nav.tabs{display:flex;background:#fff;border-top:1px solid var(--line)}
nav.tabs button{flex:1;border:0;background:none;padding:7px 2px 6px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs button span{font-size:21px;line-height:1.1}
nav.tabs button.on{color:var(--navy);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
footer.sign{background:var(--navy);color:#cbd8e6;font-size:9.5px;text-align:center;padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);line-height:1.3}
h2{font-size:17px;margin:18px 2px 8px;color:var(--navy)}
h2:first-child{margin-top:2px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,42,71,.08)}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}
.hero b{font-size:19px}.hero small{display:block;color:#b9c9da;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(15,42,71,.08)}
.stat b{display:block;font-size:24px;color:var(--navy)}.stat small{color:var(--mut);font-size:12px}
.btn{border:0;border-radius:12px;padding:13px 14px;font-size:16px;font-weight:600;background:#e3eaf2;color:var(--navy);width:100%}
.btn.primary{background:var(--navy);color:#fff}
.btn.accent{background:var(--accent);color:#2a1a00}
.btn.danger{background:#fde8e8;color:var(--bad)}
.btn.sm{padding:9px 12px;font-size:14px;width:auto}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;font-size:13px}
.act span{font-size:24px}
.btns{display:flex;gap:10px;margin:10px 0}.btns .btn{flex:1}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px;font-weight:600}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--txt);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy2)}
textarea{min-height:76px;resize:vertical}
.item{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(15,42,71,.08)}
.item .ic{width:40px;height:40px;border-radius:11px;background:#e8eff7;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mid small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .end{text-align:right;font-weight:700;color:var(--navy);font-size:14px;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#e3eaf2;color:var(--navy)}
.badge.accepted{background:#dcfce7;color:#15803d}.badge.refused{background:#fee2e2;color:#b91c1c}.badge.sent{background:#fef3c7;color:#a16207}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font-size:14px;color:var(--txt)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.add{border-style:dashed;color:var(--navy2)}
.empty{text-align:center;color:var(--mut);padding:22px 10px;font-size:14px}
.warn{border-left:4px solid var(--accent)}.warn.late{border-left-color:var(--bad)}
.line{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.line-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}.line-top input{margin:0}
.x{border:0;background:#fde8e8;color:var(--bad);border-radius:10px;width:42px;height:42px;font-size:16px;flex:none}
.lt{text-align:right;font-size:14px;color:var(--mut)}
.tot{background:var(--navy);color:#fff;border-radius:14px;padding:14px;margin:12px 0}
.tot div{display:flex;justify-content:space-between;padding:3px 0;font-size:15px}
.tot .g{font-size:20px;font-weight:800;border-top:1px solid rgba(255,255,255,.25);margin-top:6px;padding-top:9px;color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border:0}.kv span{color:var(--mut)}.kv b{text-align:right}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:110px;background:#111c28;color:#fff;padding:10px 16px;border-radius:24px;font-size:14px;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#toast.show{opacity:1}
.mut{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo"><img src="" id="logoImg" alt="Logo"></div>
    <div class="hname"><b id="gName">Lcy Daniel</b><small id="vt">Accueil</small></div>
    <button class="back" id="backBtn" data-act="back" style="display:none">‹ Retour</button>
  </header>
  <main id="view"></main>
  <div id="toast"></div>
  <nav class="tabs" id="tabs">
    <button data-tab="home"><span>🏠</span>Accueil</button>
    <button data-tab="vehicles"><span>🚗</span>Véhicules</button>
    <button data-tab="services"><span>🔧</span>Entretiens</button>
    <button data-tab="quotes"><span>📄</span>Devis</button>
    <button data-tab="settings"><span>⚙️</span>Réglages</button>
  </nav>
  <footer class="sign" id="sign"></footer>
</div>

function cw(ch, bold){
  if (SPECIAL_W[ch]) return SPECIAL_W[ch];
  const c = ch.charCodeAt(0);
  if (c >= 32 && c <= 126) return (bold ? HB : HW)[c - 32];
  if (c === 160 || c === 0x202f) return 278;
  const base = ch.normalize('NFD').charCodeAt(0);
  if (base >= 32 && base <= 126) return (bold ? HB : HW)[base - 32];
  return 556;
}
function enc(s){
  let o = '';
  for (const ch of String(s)) {
    let c = ch.charCodeAt(0);
    if (WIN[ch] !== undefined) c = WIN[ch];
    else if (c === 0x202f || c === 0xa0) c = 32;
    else if (c > 255) c = 63;
    else if (c < 32) c = 32;
    if (c === 40 || c === 41 || c === 92) o += '\\' + String.fromCharCode(c); else o += String.fromCharCode(c);
  }
  return o;
}

class PDF {
  constructor(){ this.W = 595.28; this.H = 841.89; this.pages = []; this.addPage(); }
  addPage(){ this.cur = []; this.pages.push(this.cur); return this.pages.length - 1; }
  logo(x, y, h){ const w = h * LOGO_W / LOGO_H; this.cur.push('q ' + w.toFixed(2) + ' 0 0 ' + h.toFixed(2) + ' ' + x.toFixed(2) + ' ' + (this.H - y - h).toFixed(2) + ' cm /Im1 Do Q'); }
  rgb(h){ h = h.replace('#', ''); return [0, 2, 4].map(i => (parseInt(h.substr(i, 2), 16) / 255).toFixed(3)).join(' '); }
  rect(x, y, w, h, fill, stroke, lw){
    const o = ['q'];
    if (fill) o.push(this.rgb(fill) + ' rg');
    if (stroke) o.push(this.rgb(stroke) + ' RG ' + (lw || 0.7) + ' w');
    o.push(x.toFixed(2) + ' ' + (this.H - y - h).toFixed(2) + ' ' + w.toFixed(2) + ' ' + h.toFixed(2) + ' re ' + (fill && stroke ? 'B' : fill ? 'f' : 'S'));
    o.push('Q'); this.cur.push(o.join('\n'));
  }
  line(x1, y1, x2, y2, color, lw){
    this.cur.push('q ' + this.rgb(color || '#cccccc') + ' RG ' + (lw || 0.7) + ' w ' + x1.toFixed(2) + ' ' + (this.H - y1).toFixed(2) + ' m ' + x2.toFixed(2) + ' ' + (this.H - y2).toFixed(2) + ' l S Q');
  }
  tw(s, size, bold){ let w = 0; for (const ch of String(s)) w += cw(ch, bold); return w * size / 1000; }
  text(s, x, y, o){
    o = o || {}; const size = o.size || 10; const bold = !!o.bold; s = String(s);
    const w = this.tw(s, size, bold);
    if (o.align === 'right') x -= w; else if (o.align === 'center') x -= w / 2;
    this.cur.push('q BT /' + (bold ? 'F2' : 'F1') + ' ' + size + ' Tf ' + this.rgb(o.color || '#1b2733') + ' rg ' + x.toFixed(2) + ' ' + (this.H - y).toFixed(2) + ' Td (' + enc(s) + ') Tj ET Q');
  }
  wrap(s, maxW, size, bold){
    const out = [];
    String(s == null ? '' : s).split(/\r?\n/).forEach(par => {
      if (!par.trim()) { out.push(''); return; }
      let cur = '';

        while (this.tw(word, size, bold) > maxW) { // mot trop long : on le coupe

  }

      res = await P.Filesystem.writeFile({ path: name, data: b64, directory: 'CACHE' });
    }
    if (P.Share) { try { await P.Share.share({ title: name, url: res.uri, dialogTitle: 'Ouvrir / envoyer le fichier' }); } catch (e) {} }
    return;
  }
  const url = URL.createObjectURL(binToBlob(bin, mime));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
  toast('Fichier ' + name + ' généré');
}

const NAVY = '#0f2a47', ACCENT = '#f59e0b', GREY = '#6b7a89';
function pdfHeader(pdf, title, l1, l2){

function pdfInfoBox(pdf, y, title, pairs){
  const rows = Math.ceil(pairs.length / 2), h = 30 + rows * 17, x = 40, w = pdf.W - 80;
  pdf.rect(x, y, w, h, '#f3f6fa', '#dfe6ee');
  pdf.rect(x, y, 4, h, ACCENT);
  pdf.text(title, x + 14, y + 17, { size: 9, bold: true, color: NAVY });
  pairs.forEach((p, i) => {
    const col = i % 2, row = Math.floor(i / 2), cx = x + 14 + col * (w / 2), cy = y + 36 + row * 17;

    pdf.text(pdf.fit(p[1] || '—', w / 2 - 90, 9.5, true), cx + 72, cy, { size: 9.5, bold: true });
  });
  return y + h + 14;
}
function pdfFooters(pdf){
  const n = pdf.pages.length;
  for (let i = 0; i < n; i++) {
    pdf.cur = pdf.pages[i];
    pdf.line(40, pdf.H - 42, pdf.W - 40, pdf.H - 42, '#dfe6ee', 0.8);
    pdf.text(signature(), pdf.W / 2, pdf.H - 27, { size: 8, color: GREY, align: 'center' });
    pdf.text('Page ' + (i + 1) + '/' + n, pdf.W - 40, pdf.H - 27, { size: 8, color: GREY, align: 'right' });

}
function pdfSignatures(pdf, y, left, right){
  const w = (pdf.W - 80 - 20) / 2;
  [left, right].forEach((t, i) => {
    const x = 40 + i * (w + 20);
    pdf.rect(x, y, w, 78, null, '#c9d3de');
    pdf.text(t, x + 10, y + 15, { size: 8.5, bold: true, color: NAVY });
  });
  return y + 90;
}

/* ============================================================
   CALCULS
   ============================================================ */
function qTotals(q){
  const sub = (q.lines || []).reduce((a, l) => a + num(l.qty) * num(l.price), 0);
  const disc = sub * num(q.discount) / 100, ht = sub - disc, vat = ht * num(q.vat) / 100;
  return { sub, disc, ht, vat, total: ht + vat };
}
function reminders(){
  const out = [], t = today(), in30 = addDays(t, 30);
  DB.vehicles.forEach(v => {
    const ss = DB.services.filter(s => s.vehicleId === v.id).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const last = ss[0]; if (!last) return;
    const curKm = Math.max(num(v.km), ...ss.map(s => num(s.km)));
    const why = []; let late = false;
    if (last.nextDate && last.nextDate <= in30) { if (last.nextDate < t) { late = true; why.push('date dépassée (' + fdate(last.nextDate) + ')'); } else why.push('prévu le ' + fdate(last.nextDate)); }
    if (num(last.nextKm) && curKm >= num(last.nextKm) - 500) { if (curKm >= num(last.nextKm)) late = true; why.push('à ' + fmtNum(num(last.nextKm)) + ' km (actuel ' + fmtNum(curKm) + ')'); }
    if (why.length) out.push({ v, why: why.join(' • '), late });
  });
  return out.sort((a, b) => b.late - a.late);
}

  <div class="kv"><span>Année / énergie</span><b>${esc([v.year, v.fuel].filter(Boolean).join(' / ')) || '—'}</b></div>
  <div class="kv"><span>Kilométrage</span><b>${v.km ? fmtNum(num(v.km)) + ' km' : '—'}</b></div>
  ${v.vin ? `<div class="kv"><span>Châssis</span><b>${esc(v.vin)}</b></div>` : ''}${v.notes ? `<div class="kv"><span>Remarques</span><b>${esc(v.notes)}</b></div>` : ''}</div>
  <div class="grid2"><button class="btn primary" data-act="newService" data-vid="${v.id}">🔧 Entretien</button><button class="btn primary" data-act="newQuote" data-vid="${v.id}">📄 Devis</button></div>
  <div class="grid2" style="margin-top:10px"><button class="btn" data-act="editVehicle" data-id="${v.id}">✏️ Modifier</button><button class="btn accent" data-act="pdfHistory" data-id="${v.id}">📥 PDF historique</button></div>
  <h2>Entretiens (${ss.length})</h2>${ss.length ? ss.map(serviceItem).join('') : '<div class="card empty">Aucun entretien.</div>'}
  <h2>Devis (${qs.length})</h2>${qs.length ? qs.map(quoteItem).join('') : '<div class="card empty">Aucun devis.</div>'}
  <div class="btns"><button class="btn danger" data-act="delVehicle" data-id="${v.id}">🗑 Supprimer ce véhicule</button></div>`;
};

/* --- Entretiens --- */
function serviceListHtml(){
  const q = search.toLowerCase();
  const l = DB.services.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).filter(s => { const v = vehOf(s.vehicleId) || {}; return !q || [v.owner, v.make, v.plate, (s.ops || []).join(' '), s.other, s.number].join(' ').toLowerCase().includes(q); });
  return l.length ? l.map(serviceItem).join('') : '<div class="card empty">Aucun entretien enregistré.</div>';
}
V.services = () => `<button class="btn primary" data-act="newService">+ Nouvel entretien</button>
  <input id="search" data-list="services" placeholder="🔍 Rechercher…" style="margin:10px 0" value="${esc(search)}"><div id="list">${serviceListHtml()}</div>`;

function vehicleSelect(sel){
  return `<label>Véhicule / client *<select data-d="vehicleId"><option value="">— Choisir —</option>${DB.vehicles.map(v => `<option value="${v.id}" ${sel === v.id ? 'selected' : ''}>${esc(vLabel(v))} — ${esc(v.owner || '')}</option>`).join('')}</select></label>`;
}
V.service = p => {
  const ex = p.id && DB.services.find(s => s.id === p.id);
  if (ex) draft = clone(ex);
  else { const v = vehOf(p.vehicleId); draft = { id: uid(), number: '', vehicleId: p.vehicleId || '', date: today(), km: v ? v.km : '', ops: [], other: '', details: '', labor: '', parts: '', nextDate: '', nextKm: '', paid: false, _new: true }; }
  const d = draft;
  if (!DB.vehicles.length) return `<div class="card empty">Ajoutez d’abord un véhicule.<br><br><button class="btn primary" data-act="newVehicle">+ Nouveau véhicule</button></div>`;
  return `<div class="card">${vehicleSelect(d.vehicleId)}
  <div class="grid2"><label>Date<input type="date" data-d="date" value="${esc(d.date)}"></label><label>Kilométrage<input type="number" inputmode="numeric" data-d="km" value="${esc(d.km)}"></label></div>
  <label>Opérations effectuées</label><div class="chips">${OPS.map(o => `<button type="button" class="chip ${d.ops.includes(o) ? 'on' : ''}" data-act="toggleOp" data-op="${esc(o)}">${esc(o)}</button>`).join('')}</div>
  <label>Autre opération<input data-d="other" value="${esc(d.other)}" placeholder="Précisez si besoin"></label>
  <label>Observations<textarea data-d="details" placeholder="Pièces changées, remarques, état du véhicule…">${esc(d.details)}</textarea></label></div>
  <div class="card"><div class="grid2"><label>Main d’œuvre (${CUR})<input type="number" inputmode="decimal" step="any" data-d="labor" value="${esc(d.labor)}"></label>
  <label>Pièces (${CUR})<input type="number" inputmode="decimal" step="any" data-d="parts" value="${esc(d.parts)}"></label></div>
  <div class="kv"><span>Total</span><b id="sTotal">${money(num(d.labor) + num(d.parts))}</b></div>
  <label style="margin-top:10px;display:flex;gap:10px;align-items:center;font-size:15px;color:var(--txt)"><input type="checkbox" data-d="paid" ${d.paid ? 'checked' : ''} style="width:22px;height:22px;margin:0"> Entretien payé</label></div>
  <div class="card"><b style="color:var(--navy)">Prochain entretien</b><div class="grid2" style="margin-top:8px"><label>Date prévue<input type="date" data-d="nextDate" value="${esc(d.nextDate)}"></label><label>À (km)<input type="number" inputmode="numeric" data-d="nextKm" value="${esc(d.nextKm)}"></label></div></div>
  <div class="btns"><button class="btn primary" data-act="saveService">💾 Enregistrer</button><button class="btn accent" data-act="pdfService">📥 PDF</button></div>
  ${ex ? `<button class="btn danger" data-act="delService">🗑 Supprimer</button>` : ''}`;
};

/* --- Devis --- */
function quoteListHtml(){
  const q = search.toLowerCase();
  const l = DB.quotes.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).filter(x => { const v = vehOf(x.vehicleId) || {}; return !q || [v.owner, v.make, v.plate, x.number, STATUS[x.status]].join(' ').toLowerCase().includes(q); });
  return l.length ? l.map(quoteItem).join('') : '<div class="card empty">Aucun devis enregistré.</div>';
}
V.quotes = () => `<button class="btn primary" data-act="newQuote">+ Nouveau devis</button>
  <input id="search" data-list="quotes" placeholder="🔍 Rechercher (client, n°, statut…)" style="margin:10px 0" value="${esc(search)}"><div id="list">${quoteListHtml()}</div>`;

function linesHtml(){
  if (!draft.lines.length) return '<div class="empty">Aucune ligne. Touchez une suggestion ci-dessus ou « + Ligne ».</div>';
  return draft.lines.map((l, i) => `<div class="line"><div class="line-top"><input placeholder="Désignation (pièce ou main d’œuvre)" value="${esc(l.name)}" data-line="${i}" data-f="name"><button class="x" data-act="delLine" data-i="${i}">✕</button></div>
  <div class="grid2"><label style="margin:0">Quantité<input type="number" inputmode="decimal" step="any" value="${esc(l.qty)}" data-line="${i}" data-f="qty"></label><label style="margin:0">Prix unitaire<input type="number" inputmode="decimal" step="any" value="${esc(l.price)}" data-line="${i}" data-f="price"></label></div>
  <div class="lt">Total ligne : <b id="lt${i}">${money(num(l.qty) * num(l.price))}</b></div></div>`).join('');
}
function totalsHtml(){
  const T = qTotals(draft); const vat = num(draft.vat);
  return `<div>Sous-total<span>${money(T.sub)}</span></div>${num(draft.discount) ? `<div>Remise ${fmtNum(num(draft.discount))} %<span>- ${money(T.disc)}</span></div>` : ''}${vat ? `<div>Total HT<span>${money(T.ht)}</span></div><div>TVA ${fmtNum(vat)} %<span>${money(T.vat)}</span></div>` : ''}<div class="g">${vat ? 'TOTAL TTC' : 'TOTAL'}<span>${money(T.total)}</span></div>`;
}
V.quote = p => {
  const ex = p.id && DB.quotes.find(x => x.id === p.id);
  if (ex) draft = clone(ex);
  else draft = { id: uid(), number: '', vehicleId: p.vehicleId || '', date: today(), lines: [], discount: '', vat: DB.settings.vat || '', validity: DB.settings.validity || 30, status: 'draft', notes: '', _new: true };
  const d = draft;
  if (!DB.vehicles.length) return `<div class="card empty">Ajoutez d’abord un véhicule.<br><br><button class="btn primary" data-act="newVehicle">+ Nouveau véhicule</button></div>`;
  return `<div class="card">${vehicleSelect(d.vehicleId)}
  <div class="grid2"><label>Date<input type="date" data-d="date" value="${esc(d.date)}"></label><label>Statut<select data-d="status">${Object.keys(STATUS).map(k => `<option value="${k}" ${d.status === k ? 'selected' : ''}>${STATUS[k]}</option>`).join('')}</select></label></div></div>
  <h2>Lignes du devis</h2>
  <div class="chips">${PRESETS.map(n => `<button type="button" class="chip add" data-act="addPreset" data-n="${esc(n)}">+ ${esc(n)}</button>`).join('')}</div>
  <div id="lines">${linesHtml()}</div>
  <button class="btn" data-act="addLine">+ Ligne vide</button>
  <div class="card" style="margin-top:12px"><div class="grid2"><label>Remise (%)<input type="number" inputmode="decimal" step="any" data-d="discount" value="${esc(d.discount)}"></label><label>TVA (%)<input type="number" inputmode="decimal" step="any" data-d="vat" value="${esc(d.vat)}"></label></div>
  <div class="grid2"><label>Validité (jours)<input type="number" inputmode="numeric" data-d="validity" value="${esc(d.validity)}"></label><span></span></div>
  <label>Observations<textarea data-d="notes" placeholder="Conditions, délais, garantie…">${esc(d.notes)}</textarea></label></div>
  <div class="tot" id="qTot">${totalsHtml()}</div>
  <div class="btns"><button class="btn primary" data-act="saveQuote">💾 Enregistrer</button><button class="btn accent" data-act="pdfQuote">📥 PDF</button></div>
  ${ex ? `<button class="btn danger" data-act="delQuote">🗑 Supprimer</button>` : ''}`;
};

/* --- Réglages --- */
V.settings = () => { const s = DB.settings; return `<div class="card"><b style="color:var(--navy)">Informations du garage</b><div style="height:8px"></div>
  <label>Nom du garage<input data-s="garage" value="${esc(s.garage)}"></label>
  <label>Téléphone<input data-s="phone" type="tel" value="${esc(s.phone)}" placeholder="034 00 000 00"></label>
  <label>Adresse<input data-s="address" value="${esc(s.address)}" placeholder="Ex : Lot 000, Antananarivo, Madagascar"></label>
  <label>NIF / STAT (facultatif)<input data-s="nif" value="${esc(s.nif)}"></label>
  <div class="grid2"><label>TVA (%)<input data-s="vat" type="number" inputmode="decimal" step="any" value="${esc(s.vat)}"></label><label>Validité devis (j)<input data-s="validity" type="number" inputmode="numeric" value="${esc(s.validity)}"></label></div>
  <div class="mut">Devise : Ariary malgache (MGA). Les modifications sont enregistrées automatiquement et apparaissent dans les PDF.</div></div>
  <div class="card"><b style="color:var(--navy)">Sauvegarde des données</b><p class="mut" style="margin:6px 0 10px">Exportez régulièrement vos données pour ne rien perdre (changement de téléphone, désinstallation…).</p>
  <div class="grid2"><button class="btn primary" data-act="export">⬆️ Exporter</button><button class="btn" data-act="import">⬇️ Importer</button></div>
  <input type="file" id="impFile" accept=".json,application/json" style="display:none"></div>
  <div class="card"><button class="btn danger" data-act="wipe">🗑 Effacer toutes les données</button></div>`; };

/* ============================================================
   ACTIONS
   ============================================================ */
function validVehicle(){ const d = draft; if (!d.owner.trim()) { toast('Indiquez le nom du client'); return false; } if (!d.make.trim()) { toast('Indiquez la marque / le modèle'); return false; } return true; }
function saveVehicle(){
  if (!validVehicle()) return false;
  draft.plate = (draft.plate || '').toUpperCase().trim(); draft.owner = draft.owner.trim(); draft.make = draft.make.trim();
  const i = DB.vehicles.findIndex(v => v.id === draft.id); if (i >= 0) DB.vehicles[i] = draft; else DB.vehicles.push(draft);
  save(); toast('Véhicule enregistré ✓'); return true;
}
function saveService(){
  const d = draft;
  if (!d.vehicleId) { toast('Choisissez un véhicule'); return false; }
  if (!d.ops.length && !(d.other || '').trim() && !(d.details || '').trim()) { toast('Indiquez au moins une opération'); return false; }
  const o = clone(d); const isNew = o._new; delete o._new;
  if (!o.number) o.number = nextNumber('E');
  const i = DB.services.findIndex(s => s.id === o.id); if (i >= 0) DB.services[i] = o; else DB.services.push(o);
  const v = vehOf(o.vehicleId); if (v && num(o.km) > num(v.km)) v.km = o.km;
  draft = o; save(); toast('Entretien enregistré ✓'); return true;
}
function saveQuote(){
  const d = draft;
  if (!d.vehicleId) { toast('Choisissez un véhicule'); return false; }
  const lines = d.lines.filter(l => (l.name || '').trim() || num(l.price));
  if (!lines.length) { toast('Ajoutez au moins une ligne'); return false; }
  if (lines.some(l => !(l.name || '').trim())) { toast('Chaque ligne doit avoir une désignation'); return false; }
  const o = clone(d); o.lines = lines.map(l => ({ name: l.name.trim(), qty: num(l.qty) || 1, price: num(l.price) })); delete o._new;
  if (!o.number) o.number = nextNumber('D');
  const i = DB.quotes.findIndex(q => q.id === o.id); if (i >= 0) DB.quotes[i] = o; else DB.quotes.push(o);
  draft = o; save(); toast('Devis enregistré ✓'); return true;
}
function markSaved(){ route.params = { id: draft.id }; history.replaceState(route, ''); }
function updateQuoteUi(){ const t = $('#qTot'); if (t) t.innerHTML = totalsHtml(); draft.lines.forEach((l, i) => { const e = $('#lt' + i); if (e) e.textContent = money(num(l.qty) * num(l.price)); }); }

const ACT = {
  back,
  newVehicle: () => go('vehicleForm'),
  editVehicle: d => go('vehicleForm', { id: d.id }),
  openVehicle: d => go('vehicle', { id: d.id }),
  openService: d => go('service', { id: d.id }),
  openQuote: d => go('quote', { id: d.id }),
  newService: d => go('service', { vehicleId: d.vid || '' }),
  newQuote: d => go('quote', { vehicleId: d.vid || '' }),
  saveVehicle: () => { if (saveVehicle()) back(); },
  saveService: () => { if (saveService()) back(); },
  saveQuote: () => { if (saveQuote()) back(); },
  toggleOp: (d, e) => { const o = d.op, i = draft.ops.indexOf(o); if (i >= 0) draft.ops.splice(i, 1); else draft.ops.push(o); e.target.closest('.chip').classList.toggle('on'); },
  addPreset: d => { draft.lines.push({ name: d.n, qty: 1, price: '' }); $('#lines').innerHTML = linesHtml(); updateQuoteUi(); const inp = document.querySelectorAll('#lines [data-f="price"]'); if (inp.length) inp[inp.length - 1].focus(); },
  addLine: () => { draft.lines.push({ name: '', qty: 1, price: '' }); $('#lines').innerHTML = linesHtml(); const inp = document.querySelectorAll('#lines [data-f="name"]'); inp[inp.length - 1].focus(); },
  delLine: d => { draft.lines.splice(+d.i, 1); $('#lines').innerHTML = linesHtml(); updateQuoteUi(); },
  delVehicle: d => {
    const ns = DB.services.filter(s => s.vehicleId === d.id).length, nq = DB.quotes.filter(q => q.vehicleId === d.id).length;
    if (!confirm('Supprimer ce véhicule' + (ns + nq ? ' ainsi que ses ' + ns + ' entretien(s) et ' + nq + ' devis' : '') + ' ?')) return;
    DB.vehicles = DB.vehicles.filter(v => v.id !== d.id); DB.services = DB.services.filter(s => s.vehicleId !== d.id); DB.quotes = DB.quotes.filter(q => q.vehicleId !== d.id); save(); toast('Véhicule supprimé'); back();
  },
  delService: () => { if (!confirm('Supprimer cet entretien ?')) return; DB.services = DB.services.filter(s => s.id !== draft.id); save(); toast('Entretien supprimé'); back(); },
  delQuote: () => { if (!confirm('Supprimer ce devis ?')) return; DB.quotes = DB.quotes.filter(q => q.id !== draft.id); save(); toast('Devis supprimé'); back(); },
  pdfQuote: async () => { if (!saveQuote()) return; markSaved(); await saveFile(pdfQuote(draft), 'Devis_' + safeName(draft.number) + '_' + safeName(DB.settings.garage) + '.pdf', 'application/pdf'); },
  pdfService: async () => { if (!saveService()) return; markSaved(); await saveFile(pdfService(draft), 'Entretien_' + safeName(draft.number) + '_' + safeName(DB.settings.garage) + '.pdf', 'application/pdf'); },
  pdfHistory: async d => { const v = vehOf(d.id); await saveFile(pdfHistory(v), 'Historique_' + safeName(v.plate || v.make) + '.pdf', 'application/pdf'); },
  export: async () => { const j = unescape(encodeURIComponent(JSON.stringify(DB, null, 1))); await saveFile(j, 'Sauvegarde_' + safeName(DB.settings.garage) + '_' + today() + '.json', 'application/json'); },
  import: () => $('#impFile').click(),
  wipe: () => { if (!confirm('Effacer TOUTES les données (véhicules, entretiens, devis) ?')) return; if (!confirm('Dernière confirmation : cette action est irréversible.')) return; DB = DEFAULTS(); save(); toast('Données effacées'); go('home'); }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (t) { const f = ACT[t.dataset.act]; if (f) f(t.dataset, e); return; }
  const tab = e.target.closest('[data-tab]'); if (tab) go(tab.dataset.tab);
});
function onField(e){
  const t = e.target;
  if (t.dataset.d !== undefined && draft) {
    draft[t.dataset.d] = t.type === 'checkbox' ? t.checked : t.value;
    if (route.name === 'quote') updateQuoteUi();
    if (route.name === 'service') { const s = $('#sTotal'); if (s) s.textContent = money(num(draft.labor) + num(draft.parts)); }
  } else if (t.dataset.line !== undefined && draft) {
    draft.lines[+t.dataset.line][t.dataset.f] = t.value; updateQuoteUi();
  } else if (t.dataset.s !== undefined) {
    DB.settings[t.dataset.s] = ['vat', 'validity'].includes(t.dataset.s) ? t.value : t.value; save();
    if (t.dataset.s === 'garage') { $('#gName').textContent = t.value || 'Garage'; }
  } else if (t.id === 'search') {
    search = t.value; const l = $('#list'); const k = t.dataset.list;
    l.innerHTML = k === 'vehicles' ? vehicleListHtml() : k === 'services' ? serviceListHtml() : quoteListHtml();
  }
}
document.addEventListener('input', onField); document.addEventListener('change', onField);
document.addEventListener('change', e => {
  if (e.target.id !== 'impFile') return; const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try {
    const j = JSON.parse(r.result); if (!j || !Array.isArray(j.vehicles)) throw 0;
    if (!confirm('Remplacer les données actuelles par cette sauvegarde (' + j.vehicles.length + ' véhicules) ?')) return;
    DB = Object.assign(DEFAULTS(), j); DB.settings = Object.assign(DEFAULTS().settings, j.settings); delete DB.settings.currency; save(); toast('Sauvegarde importée ✓'); go('home');
  } catch (err) { toast('Fichier de sauvegarde invalide'); } };
  r.readAsText(f);
});

/* ---------- Démarrage ---------- */
$('#sign').textContent = signature(); $('#logoImg').src = LOGO_URL;
history.replaceState(route, ''); render();
</script>
</body>
</html>
